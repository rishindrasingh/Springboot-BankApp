name: Sonar-Scan
on:
  workflow_call:

jobs:
  sonar-scan:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v6
          with:
            fetch-depth: 0

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v8.2.0 
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}